/* Layout: app shell with a 4-step rail on top and one working panel below. CCA look: deep green, gold, green-tinted neutrals. */
:root {
  --bg: #f3f6f3;

  --surface-2: #e9eee9;
  --fg: #14241d;
  --muted: #5a6a62;
  --line: #d3dbd4;
  --green: #1f4a3a;
  --on-green: #f3f6f3;
  --gold: #a87526;
  --gold-soft: #f1e6cf;
  --sel-bg: #1f4a3a;
  --sel-fg: #ffffff;
  --sel-line: #1f4a3a;
  --p-fun: #b07a24;
  --p-exp: #1f4a3a;
  --p-auth: #3a5a72;
  --ok: #2c7a4b;
  --warn: #a4571a;
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1914; --surface: #16241d; --surface-2: #1d2f26; --fg: #e6eee8; --muted: #9db0a5;
    --line: #2b4036; --green: #5fae8c; --on-green: #0f1914; --gold: #d8a955; --gold-soft: #3a2f18;
    --sel-bg: #2b6e54; --sel-fg: #ffffff; --sel-line: #7cc5a4;
    --p-fun: #d8a955; --p-exp: #5fae8c; --p-auth: #7fb0d0; --ok: #62c48a; --warn: #e0925a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1914; --surface: #16241d; --surface-2: #1d2f26; --fg: #e6eee8; --muted: #9db0a5;
  --line: #2b4036; --green: #5fae8c; --on-green: #0f1914; --gold: #d8a955; --gold-soft: #3a2f18;
  --sel-bg: #2b6e54; --sel-fg: #ffffff; --sel-line: #7cc5a4;
  --p-fun: #d8a955; --p-exp: #5fae8c; --p-auth: #7fb0d0; --ok: #62c48a; --warn: #e0925a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 64px; }
.app { max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.sub { color: var(--muted); font-size: 0.88rem; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }

.top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.step { min-width: 0; text-align: left; font: inherit; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.step .n { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.step .t { min-width: 0; font-size: 0.85rem; font-weight: 500; overflow-wrap: anywhere; }
.step .t small { display: block; font-weight: 400; color: var(--muted); font-size: 0.72rem; }
.step.done .n { background: var(--green); color: var(--on-green); }
.step.on { border-color: var(--green); background: var(--surface); color: var(--fg); }
.step.on .n { background: var(--gold); color: #fff; }
.step:disabled { opacity: 0.5; cursor: not-allowed; }
@media (max-width: 620px) { .steps { grid-template-columns: repeat(5, auto); justify-content: start; } .step .t { display: none; } .step.on .t { display: none; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grow { flex: 1 1 auto; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 680px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .panel { padding: 16px; } }
label.f { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
label.f .hint { font-weight: 400; }
input[type=text], textarea, select { font: inherit; font-size: 0.95rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 74px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn { font: inherit; font-weight: 700; font-size: 0.9rem; border-radius: 8px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--green); background: var(--green); color: var(--on-green); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); font-weight: 500; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.sm { padding: 6px 11px; font-size: 0.8rem; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: inherit; font-size: 0.85rem; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.seg button.on { background: var(--sel-bg); color: var(--sel-fg); border-color: var(--sel-line); }
.seg button:disabled { opacity: 0.5; cursor: not-allowed; }

.note { background: var(--gold-soft); border-radius: 8px; padding: 12px 14px; font-size: 0.85rem; }
.internal { border: 1px dashed var(--gold); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.internal ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 0.9rem; }
.tag { display: inline-block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 1px 6px; }

.pil { display: flex; flex-direction: column; gap: 10px; }
.pilhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.fun { background: var(--p-fun); } .dot.exp { background: var(--p-exp); } .dot.auth { background: var(--p-auth); }
.count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.bad { color: var(--warn); font-weight: 700; }
.funnel { font-size: 0.62rem; letter-spacing: 0.08em; font-weight: 700; padding: 2px 7px; border-radius: 4px; color: #fff; }
.funnel.fun { background: var(--p-fun); } .funnel.exp { background: var(--p-exp); } .funnel.auth { background: var(--p-auth); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 0.92rem; font-weight: 500; padding: 8px 16px 8px 10px; border-radius: 999px; border: 1px dashed var(--line); background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 9px; }
.chip::before { content: ''; flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); box-sizing: border-box; }
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); border: 1px solid var(--sel-line); }
.chip[aria-pressed="true"]::before { content: '\2713'; display: grid; place-items: center; border: 0; background: var(--sel-fg); color: var(--sel-bg); font-size: 0.68rem; font-weight: 700; }

.tablewrap { overflow-x: auto; }
.mix { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mrow { display: grid; grid-template-columns: minmax(90px, 1fr) minmax(90px, 0.9fr) minmax(170px, 1.6fr) auto; gap: 10px 14px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.mrow.okrow { border-color: var(--ok); }
.mrow .topic { font-weight: 700; }
.mrow .pl { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; color: var(--muted); min-width: 0; }
.mrow .pl select { min-width: 0; }
.rec { font-size: 0.7rem; color: var(--ok); font-weight: 700; }
.mhead { display: grid; grid-template-columns: minmax(90px, 1fr) minmax(90px, 0.9fr) minmax(170px, 1.6fr) auto; gap: 10px 14px; padding: 0 12px; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

.mrow .ap { font: inherit; font-size: 0.8rem; font-weight: 700; padding: 7px 10px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); }
.mrow .ap[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.hintline { font-size: 0.78rem; color: var(--muted); grid-column: 1 / -1; line-height: 1.45; }
.hintline b { color: var(--fg); font-weight: 700; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font: inherit; font-size: 0.8rem; padding: 6px 11px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums; }
.tabs button.on { background: var(--sel-bg); border-color: var(--sel-line); color: var(--sel-fg); }
.slide { border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: var(--bg); }
.slidehead { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: center; }
.item { display: flex; flex-direction: column; gap: 3px; }
.item .k { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.item .v { font-size: 1rem; overflow-wrap: anywhere; }
.item ul { margin: 2px 0 0; padding-left: 18px; }
.item.h { border-top: 1px solid var(--line); padding-top: 12px; }
.item.h .k { color: var(--fg); font-family: var(--font-display); font-size: 1rem; letter-spacing: 0; text-transform: none; }
.fallback { display: flex; flex-direction: column; gap: 6px; }
.fallback textarea { min-height: 120px; font-size: 0.8rem; }
.ctopic { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.ctopic:first-of-type { border-top: 0; padding-top: 0; }
.pieces { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 3px; font-size: 0.92rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { .panel { animation: rise 0.25s ease-out; } @keyframes rise { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: none; } } }

.plist { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); }
.prow-open { flex: 1 1 auto; text-align: left; justify-content: flex-start; }
.prow .count { white-space: nowrap; }

    topics.map(function (t) {
      var c = t.combo;
      return '<div class="ctopic"><div class="pilhead"><span class="dot ' + c.pillar.id + '"></span><span class="funnel ' + c.pillar.id + '">' + c.pillar.funnel + '</span><b>' + esc(c.topic) + '</b><span class="sub">' + esc(t.style.name) + '</span><span class="count">' + t.pieces.length + '</span></div><ol class="pieces">' +
        t.pieces.map(function (pc) { return '<li>' + esc(pc) + '</li>'; }).join('') + '</ol></div>';
    }).join('') + '</div>' +
    '<div class="note">Each piece becomes one video, shaped by its style (a ranking video ranks 8-10 items, a yes/no runs 9-20 questions). Allocation across Online / Offline / Association is left for later, as in your deck.</div>' +
    '<div class="foot"><button class="btn ghost" data-go="3">Back to blueprint</button><button class="btn" data-copy="topics">Copy all content topics</button></div></section>';
}
function viewBlueprint() {
  var slides = buildSlides(), i = state.slide, s = slides[i];
  return '<section class="panel">' +
    '<div class="head"><span class="eyebrow">Step 4 · Blueprint content</span><h2>Slide-by-slide content for ' + esc(state.dna.name || 'this client') + '</h2><p class="sub">Same fixed format every time (' + slides.length + ' slides). Text only, no designed slides. The content engine and the styles stay internal.</p></div>' +
    '<div class="tabs" id="tabs">' + slides.map(function (x, n) { return '<button data-slide="' + n + '" class="' + (n === i ? 'on' : '') + '" title="' + esc(x.name) + '">' + (n + 1) + '</button>'; }).join('') + '</div>' +
    '<article class="slide"><div class="slidehead"><div><span class="eyebrow">Slide ' + (i + 1) + ' of ' + slides.length + '</span><h3>' + esc(s.name) + '</h3></div><button class="btn ghost sm" data-copy="one">Copy slide text</button></div>' +
    s.items.map(function (it) {
      if (it.h) return '<div class="item h"><span class="k">' + esc(it.k) + '</span></div>';
      return '<div class="item"><span class="k">' + esc(it.k) + '</span>' + (it.list ? '<ul>' + it.list.map(function (x) { return '<li class="v">' + esc(x) + '</li>'; }).join('') + '</ul>' : '<span class="v">' + esc(it.v) + '</span>') + '</div>';
    }).join('') + '</article>' +
    '<div class="fallback" id="fb" hidden><span class="sub">Copy was blocked here. Press Ctrl or Cmd + C to copy the selected text.</span><textarea id="fbt" readonly></textarea></div>' +
    '<div class="note">Part 3 (titles and full content per topic and style) comes after the client upgrades. This blueprint only gives direction.</div>' +
    '<div class="foot"><div class="row"><button class="btn ghost" data-go="2">Back to styles</button><button class="btn ghost" data-slide-nav="-1"' + (i === 0 ? ' disabled' : '') + '>Previous slide</button><button class="btn ghost" data-slide-nav="1"' + (i === slides.length - 1 ? ' disabled' : '') + '>Next slide</button></div><button class="btn" data-copy="all">Copy all ' + slides.length + ' slides</button></div>' + '<div class="foot"><span class="sub">Optional next step: branch the approved topics into content pieces.</span><button class="btn gold" data-go="4" data-unlock="4">Generate content →</button></div></section>';
}
function shellHtml() {
  return '<div class="app">' +
    '<header class="top"><div class="row"><button class="btn ghost sm" data-home>\u2190 Projects</button><h1 style="font-size:1.3rem;margin:0">' + esc(state.dna.name || state.projectName || 'Untitled client') + '</h1></div><span class="count" id="saveBadge">Saved</span></header>' +
    '<nav class="steps" id="steps" aria-label="Steps"></nav><main id="main"></main></div>';
}
function render() {
  var app = document.getElementById('app');
  if (!window.__sb) { app.innerHTML = configWarning(); return; }
  if (state.screen === 'home') { renderHome(); return; }
  app.innerHTML = shellHtml();
  renderSteps();
  $('#main').innerHTML = [viewDna, viewTopics, viewStyles, viewBlueprint, viewContent][state.step]();
  updateSaveBadge();
  scheduleSave();
}
function timeago(ts) {
  if (!ts) return '';
  var s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function configWarning() {
  return '<div class="app"><section class="panel"><span class="eyebrow">Setup</span><h2>Add your Supabase keys</h2><p class="sub">Open config.js, paste your Supabase URL and anon key, then reload this page.</p></section></div>';
}
function blankDna() { return { person: '', name: '', title: '', industry: '', goal: '', experience: '', icp: '', offer: '' }; }
function blankState() { return { phase: 'fresh', step: 0, preset: 'media', dna: blankDna(), sel: {}, slots: [], team: true, mixSig: '', ok: {}, slide: 0, numContents: 12 }; }
var projects = [];
function renderHome() {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="app">' +
    '<header class="top"><div><h1>Content Engine</h1><p class="sub">Your client projects</p></div><button class="btn" data-newproj>New client</button></header>' +
    '<div class="plist">' + (projects === null ? '<p class="sub">Loading\u2026</p>' :
      (projects.length ? projects.map(function (p) {
        return '<div class="prow"><button class="btn ghost prow-open" data-open="' + p.id + '"><b>' + esc(p.name) + '</b></button><span class="count">' + esc(p.phase || 'fresh') + ' \u00b7 ' + timeago(p.updated_at) + '</span><button class="btn ghost sm" data-del="' + p.id + '" data-delname="' + esc(p.name) + '">Delete</button></div>';
      }).join('') : '<p class="sub">No projects yet. Click New client to start.</p>')) + '</div></div>';
}
var sb = null;
function initApp() {
  var c = window.APP_CONFIG;
  if (!c || !c.SUPABASE_URL || c.SUPABASE_URL.indexOf('YOUR-') >= 0) { document.getElementById('app').innerHTML = configWarning(); return; }
  sb = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
  window.__sb = sb;
  goHome();
}
function goHome() { state.screen = 'home'; projects = null; renderHome(); loadProjects(); }
function loadProjects() {
  sb.from('projects').select('id,name,phase,updated_at').order('updated_at', { ascending: false }).then(function (r) {
    projects = (r && r.data) || []; if (state.screen === 'home') renderHome();
  });
}
function newProject() {
  var name = window.prompt('Client name?', 'New client'); if (name === null) return;
  sb.from('projects').insert({ name: name || 'Untitled client', phase: 'fresh', data: blankState() }).select().single().then(function (r) { if (r && r.data) openRow(r.data); });
}
function openProject(id) { sb.from('projects').select('*').eq('id', id).single().then(function (r) { if (r && r.data) openRow(r.data); }); }
function openRow(row) {
  var d = row.data || {}, st = blankState();
  Object.keys(st).forEach(function (k) { if (d[k] !== undefined) st[k] = d[k]; });
  Object.keys(state).forEach(function (k) { delete state[k]; });
  Object.keys(st).forEach(function (k) { state[k] = st[k]; });
  state.screen = 'project'; state.projectId = row.id; state.projectName = row.name; state.saved = true;
  maxStep = st.step || 0;
  render();
}
function deleteProject(id, name) {
  if (!window.confirm('Delete "' + name + '"? This cannot be undone.')) return;
  sb.from('projects').delete().eq('id', id).then(function () { loadProjects(); });
}
var saveTimer;
function scheduleSave() { state.saved = false; updateSaveBadge(); clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 700); }
function doSave() {
  if (!state.projectId || !sb) return;
  var data = {}; ['phase', 'step', 'preset', 'dna', 'sel', 'slots', 'team', 'mixSig', 'ok', 'slide', 'numContents'].forEach(function (k) { data[k] = state[k]; });
  sb.from('projects').update({ name: state.dna.name || state.projectName || 'Untitled client', phase: state.phase || 'fresh', data: data }).eq('id', state.projectId).then(function () { state.saved = true; updateSaveBadge(); });
}
function updateSaveBadge() { var el = document.getElementById('saveBadge'); if (el) el.textContent = state.saved ? 'Saved' : 'Saving\u2026'; }
var toastTimer;
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 1800); }
function copyText(text) {
  var done = function () { toast('Copied'); };
  var fail = function () { var fb = $('#fb'), ta = $('#fbt'); if (fb && ta) { fb.hidden = false; ta.value = text; ta.focus(); ta.select(); } };
  try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('button'); if (!el) return;
  if (el.hasAttribute('data-home')) { goHome(); return; }
  if (el.hasAttribute('data-newproj')) { newProject(); return; }
  if (el.dataset.open) { openProject(el.dataset.open); return; }
  if (el.dataset.del) { deleteProject(el.dataset.del, el.dataset.delname || ''); return; }
  if (el.dataset.team !== undefined) { state.team = el.dataset.team === '1'; render(); return; }
  if (el.dataset.preset) { loadPreset(el.dataset.preset); maxStep = 0; render(); return; }
  if (el.dataset.go !== undefined) {
    var n = +el.dataset.go; if (el.disabled) return;
    if (el.dataset.unlock) maxStep = Math.max(maxStep, n);
    if (n === 2) buildMix();
    if (n === 3 || n === 4) state.slide = 0;
    state.step = n; render(); window.scrollTo(0, 0); return;
  }
  if (el.dataset.topic) { state.sel[el.dataset.topic] = !state.sel[el.dataset.topic]; maxStep = Math.min(maxStep, 1); render(); return; }
  if (el.id === 'selAll') { PILLARS.forEach(function (pl) { pillarTopics(pl.id).forEach(function (t) { state.sel[t] = true; }); }); render(); return; }
  if (el.dataset.ok) { state.ok[el.dataset.ok] = !state.ok[el.dataset.ok]; render(); return; }
  if (el.id === 'apAll') { state.slots.forEach(function (x) { state.ok[x.id] = true; }); render(); return; }
  if (el.dataset.slide) { state.slide = +el.dataset.slide; render(); return; }
  if (el.dataset.slideNav) { state.slide = Math.max(0, Math.min(buildSlides().length - 1, state.slide + +el.dataset.slideNav)); render(); return; }
  if (el.dataset.copy) {
    if (el.dataset.copy === 'deck') { copyText(deckText()); return; }
    if (el.dataset.copy === 'topics') { copyText(topicsText()); return; }
    var sl = buildSlides();
    copyText(el.dataset.copy === 'one' ? slideText(sl[state.slide], state.slide) : sl.map(slideText).join('\n'));
  }
});
document.addEventListener('input', function (e) { if (e.target.id === 'numInput') { state.numContents = Math.max(1, parseInt(e.target.value, 10) || 1); return; } if (e.target.dataset && e.target.dataset.f) state.dna[e.target.dataset.f] = e.target.value; });
document.addEventListener('change', function (e) {
  var d = e.target.dataset; if (!d) return;
  if (e.target.id === 'numInput') { state.numContents = Math.max(1, parseInt(e.target.value, 10) || 1); render(); return; }
  if (!d.slotstyle) return;
  var slot = state.slots.filter(function (x) { return x.id === d.slotstyle; })[0]; if (!slot) return;
  slot.style = e.target.value; state.ok[d.slotstyle] = true; render();
});

initApp();
</script>
</body>
</html>
